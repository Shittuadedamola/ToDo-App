<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>ToDo-App</title>
</head>
<body>
    <main class="bg-[url(/images/bg-mobile-light.jpg)] bg-cover bg-no-repeat bg-center w-[100vw] h-[27vh] ">
        <nav class="flex items-center justify-between py-12 px-7">
            <h1 class="font-bold text-white text-3xl">T O D O</h1>
            <img src="images/icon-moon.svg" alt="" class="h-[25px] w-[25px]">
        </nav>
        <div class="flex bg-white mx-7 mb-7 px-5 py-4 rounded-sm items-center">
            <div class="w-[25px] h-[25px] border rounded-full border-gray-300 border-2 mr-3"></div>
            <input type="text" placeholder="Create a new todo..." 
            class="text-gray-700 outline-none w-full" id="todoInput">
        </div>

        <section id="allTodosContainer" class="mx-7 rounded-md bg-white shadow-lg">

        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
