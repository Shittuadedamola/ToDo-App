<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>ToDo-App</title>
</head>
<body>
    <main class="bg-[url(/images/bg-mobile-light.jpg)] bg-cover bg-no-repeat bg-center w-[100vw] h-[27vh] ">
        <nav class="flex items-center justify-between py-12 px-7">
            <h1 class="font-bold text-white text-3xl">T O D O</h1>
            <img src="images/icon-moon.svg" alt="" class="h-[25px] w-[25px]">
        </nav>
        <div class="flex bg-white mx-7 mb-7 px-5 py-4 rounded-sm items-center">
            <div class="w-[25px] h-[25px] border rounded-full border-gray-300 border-2 mr-3"></div>
            <input type="text" placeholder="Create a new todo..." 
            class="text-gray-700 outline-none w-full caret-blue-500" id="todoInput">
        </div>

        <section class="mx-7 mb-7 rounded-md bg-white shadow-2xl">
            <div id="allTodosContainer">

            </div>
            <div id="totalItems" class="flex justify-between items-center px-5 py-4 text-gray-400">
                <span><span id="itemsCount">0</span> items left</span>
                <span id="clearCompleted" class="hover:text-gray-700 hover:cursor-pointer">Clear Completed</span>
            </div>
        </section>

        <div class="mx-7 mb-15 rounded-md bg-white shadow-2xl flex justify-between items-center px-20 py-4 text-gray-400 text-lg font-bold">
            <span class="text-blue-500 hover:text-gray-700 hover:cursor-pointer">All</span>
            <span class="hover:text-gray-700 hover:cursor-pointer">Active</span>
            <span class="hover:text-gray-700 hover:cursor-pointer">Completed</span>
        </div>

        <footer class="flex justify-center text-gray-400">
            Drag and drop to reorder list
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
